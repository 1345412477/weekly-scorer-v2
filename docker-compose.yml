services:
  weekly-scorer:
    build: .
    container_name: weekly-scorer
    restart: unless-stopped
    ports:
      - "80:8000"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/weekly_scorer.db
      - DATA_DIR=/app/data
      - TZ=Asia/Shanghai
