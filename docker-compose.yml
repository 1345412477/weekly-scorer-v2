# ============================================
# Docker Compose - 周报评分系统 v2
# ============================================

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: ws-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: weekly_scorer
      POSTGRES_USER: ws_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ws_user -d weekly_scorer"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存（可选，用于 AI 评分缓存）
  redis:
    image: redis:7-alpine
    container_name: ws-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ws-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://ws_user:${DB_PASSWORD:-changeme123}@postgres:5432/weekly_scorer
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost}
      ARK_API_KEY: ${ARK_API_KEY}
      ARK_BASE_URL: ${ARK_BASE_URL:-https://ark.cn-beijing.volces.com/api/plan/v3}
      SCORING_MODEL: ${SCORING_MODEL:-doubao-seed-2.0-pro}
      VISION_MODEL: ${VISION_MODEL}
      AI_TIMEOUT: ${AI_TIMEOUT:-60}
      AI_CONNECT_TIMEOUT: ${AI_CONNECT_TIMEOUT:-10}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - uploads_data:/app/uploads
      - backups_data:/app/backups
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 前端服务（Nginx）
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ws-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    # volumes:  # 启用 HTTPS 时取消注释
    #   - ./nginx-ssl.conf:/etc/nginx/conf.d/ssl.conf:ro
    #   - ./ssl:/etc/nginx/ssl:ro

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local
  backups_data:
    driver: local
